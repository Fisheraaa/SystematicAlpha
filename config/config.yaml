data:
  token: "YOUR_TUSHARE_TOKEN"          # set via TUSHARE_TOKEN env var or replace before running --fetch
  indices: ["000300.SH", "000905.SH"]
  start_date: "2015-01-01"
  end_date:   "2024-12-31"
  rebalance_day: "first_trading_day_of_month"

universe:
  min_listing_days: 60
  max_suspension_consecutive_days: 5
  limit_band_threshold: 0.095          # exclude stocks at ±9.5% (near limit)

factors:
  mom5d_skip:   1
  mom20d_skip:  2
  zscore_window: 20
  zscore_clip:   3.0
  rsi_period:   14
  rvol_window:  20
  atr_period:   14

regime:
  vol_percentile_window: 252
  low_vol_threshold:     0.50
  high_vol_threshold:    0.70
  adx_period:            14
  adx_trending_threshold: 25

strategy:
  min_holdings:        20
  max_holdings:        40
  min_position_weight: 0.005
  max_position_weight: 0.080
  cash_reserve_min:    0.05

backtest:
  initial_capital: 10_000_000          # CNY; applied independently per run
  commission_rate:     0.00025
  stamp_duty_rate:     0.0005          # sell only
  exchange_fee_rate:   0.00001         # Shanghai-listed stocks only
  slippage_csi300:     0.0005
  slippage_csi500:     0.0010
  execution_price:     "next_day_open"

  runs:
    - run_id: "csi300"
      universe:              "000300.SH"
      benchmark:             "000300.SH"
      slippage_override:     0.0005
      ic_weight_source:      "csi300"
      combined_allocation:   null

    - run_id: "csi500"
      universe:              "000905.SH"
      benchmark:             "000905.SH"
      slippage_override:     0.0010
      ic_weight_source:      "csi500"
      combined_allocation:   null

    - run_id: "combined"
      universe:              ["000300.SH", "000905.SH"]
      benchmark:             "blended"
      slippage_override:     "by_stock"
      ic_weight_source:      "blended"
      combined_allocation:
        "000300.SH": 0.40
        "000905.SH": 0.60

risk:
  drawdown_soft_limit:       0.10      # reduce to 70 % invested
  drawdown_hard_limit:       0.15      # reduce to 50 %
  drawdown_extreme:          0.20      # reduce to 20 %
  recovery_threshold:        0.05
  recovery_rate_per_month:   0.10

walk_forward:
  train_months: 24
  test_months:   6
  step_months:   3
  is_start:  "2016-02-01"
  is_end:    "2020-12-31"
  oos_start: "2021-01-01"
  oos_end:   "2024-12-31"
